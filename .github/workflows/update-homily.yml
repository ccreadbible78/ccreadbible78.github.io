# 每日讲道自动更新
# 由 GitHub 自己的服务器运行：只读抓思高原站最新讲道，验过 MP3 能打开后，把新条目插到 index.html 顶部并提交。
# 没新讲道就不提交；MP3 验不过、原站打不开时也不提交、不改文件。
# 定时三档（北京时间），GitHub 定时任务常晚约 6 小时，落地时间按晚 6 小时估算：
# 02:30 约 08:30 落地（早上那档）；06:30 约 12:30 落地（中午那档）；12:30 约 18:30 落地（晚上那档）。
name: 每日讲道自动更新

on:
  schedule:
    - cron: '30 18 * * *'
    - cron: '30 22 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓最新讲道并更新 index.html
        run: python3 scripts/update_homily.py
      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "更新讲道：$(date -u +%Y-%m-%d)"
          git push
