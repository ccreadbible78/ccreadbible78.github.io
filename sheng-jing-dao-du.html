    <style>
      :root {
        --bg: #f6efdd;
        --bg-soft: #efe5cd;
        --card: #fffaf0;
        --ink: #2e2113;
        --ink-soft: #6d5c40;
        --gold: #9a7422;
        --gold-bright: #c39a3a;
        --line: #ddcda6;
        --deep: #241708;
        --deep-ink: #f3e7c8;
        --notice-bg: #f1e7cd;
        --shadow: 0 2px 10px rgba(62, 44, 12, 0.10);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171208;
          --bg-soft: #1f1809;
          --card: #251b0d;
          --ink: #f0e5c9;
          --ink-soft: #bfa87c;
          --gold: #c9a45c;
          --gold-bright: #e0bc72;
          --line: #4a3a1c;
          --deep: #0f0a04;
          --deep-ink: #f3e7c8;
          --notice-bg: #2b2110;
          --shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
        line-height: 1.6;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }

      .backlink {
        display: inline-flex; align-items: center; gap: 6px;
        margin: 18px 0 4px;
        color: var(--gold); text-decoration: none;
        font-size: 17px; font-weight: 600;
        padding: 10px 6px 10px 0; min-height: 44px;
      }
      .backlink:active { opacity: 0.65; }

      header.page { text-align: center; padding: 10px 4px 20px; }
      header.page .cross { color: var(--gold); font-size: 22px; letter-spacing: 0.4em; text-indent: 0.4em; }
      header.page h1 {
        margin: 6px 0 10px; font-size: 42px; font-weight: 900; letter-spacing: 0.12em; text-indent: 0.12em;
      }
      header.page .subtitle { margin: 0 auto; max-width: 560px; font-size: 17px; color: var(--ink-soft); }
      header.page .count {
        margin-top: 14px; font-size: 15px; color: var(--gold); font-weight: 700; letter-spacing: 0.2em;
      }
      .rule {
        height: 3px; margin: 18px auto 0; max-width: 520px;
        background: linear-gradient(to right, transparent, var(--gold), transparent);
        border: none;
      }

      /* ---------- player ---------- */
      .player {
        position: sticky; top: 0; z-index: 20;
        background: var(--deep); color: var(--deep-ink);
        border-radius: 0 0 14px 14px;
        box-shadow: var(--shadow);
        padding: 14px 16px 12px;
        margin: 0 -16px;
      }
      @media (min-width: 792px) { .player { margin: 0; border-radius: 14px; } }
      .player .now {
        font-size: 17px; font-weight: 700; min-height: 27px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .player .now .date { color: var(--gold-bright); font-weight: 600; margin-right: 8px; }
      .player .now.idle { color: #cdbd93; font-weight: 400; }
      .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      .progress-row .time { font-size: 13px; color: #cdbd93; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
      input[type="range"].seek {
        flex: 1; -webkit-appearance: none; appearance: none;
        height: 30px; background: transparent; cursor: pointer; margin: 0;
      }
      input[type="range"].seek::-webkit-slider-runnable-track {
        height: 6px; border-radius: 3px;
        background: linear-gradient(to right, var(--gold-bright) var(--fill, 0%), #57451d var(--fill, 0%));
      }
      input[type="range"].seek::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 20px; height: 20px; border-radius: 50%;
        background: var(--gold-bright); margin-top: -7px; border: 2px solid #f7ecd2;
      }
      input[type="range"].seek::-moz-range-track { height: 6px; border-radius: 3px; background: #57451d; }
      input[type="range"].seek::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--gold-bright); }
      input[type="range"].seek::-moz-range-thumb {
        width: 16px; height: 16px; border-radius: 50%; background: var(--gold-bright); border: 2px solid #f7ecd2;
      }
      .controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 4px; }
      .controls button {
        font-family: inherit; cursor: pointer; color: var(--deep-ink);
        background: rgba(243, 231, 200, 0.10); border: 1px solid rgba(243, 231, 200, 0.25);
        border-radius: 999px; min-width: 58px; height: 48px; padding: 0 14px;
        font-size: 15px; font-weight: 700;
        display: inline-flex; align-items: center; justify-content: center; gap: 2px;
      }
      .controls button:active { background: rgba(243, 231, 200, 0.22); }
      .controls button.main {
        width: 64px; height: 64px; min-width: 64px; padding: 0;
        background: var(--gold); border-color: var(--gold); color: #fff8e7;
      }
      .controls button.main svg { width: 26px; height: 26px; fill: currentColor; }
      .controls button.speed { min-width: 66px; font-variant-numeric: tabular-nums; }

      /* ---------- search ---------- */
      .search { margin: 22px 0 6px; }
      .search input {
        width: 100%; font-family: inherit; font-size: 18px;
        padding: 14px 16px; min-height: 54px;
        border: 1.5px solid var(--line); border-radius: 10px;
        background: var(--card); color: var(--ink);
      }
      .search input::placeholder { color: var(--ink-soft); }
      .search input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
      .result-note { font-size: 14px; color: var(--ink-soft); min-height: 22px; margin: 2px 2px 0; }

      /* ---------- sections & rows ---------- */
      section.group { margin-top: 28px; }
      section.group h2 {
        font-size: 26px; font-weight: 900; margin: 0 0 4px;
        display: flex; align-items: baseline; gap: 10px;
      }
      section.group h2 .gcount { font-size: 15px; color: var(--gold); font-weight: 700; }
      section.group .grule { height: 2px; background: var(--gold); opacity: 0.55; margin-bottom: 12px; }
      .row {
        display: flex; align-items: center; gap: 14px;
        width: 100%; text-align: left; font-family: inherit;
        background: var(--card); color: var(--ink);
        border: 1px solid var(--line); border-radius: 12px;
        padding: 14px 16px; margin-bottom: 10px;
        cursor: pointer; box-shadow: var(--shadow);
        min-height: 76px;
      }
      .row:active { transform: scale(0.995); }
      .row .meta { flex: 0 0 auto; text-align: center; min-width: 74px; }
      .row .meta .y { font-size: 21px; font-weight: 900; line-height: 1.15; }
      .row .meta .md { font-size: 14px; color: var(--ink-soft); }
      .row .body { flex: 1 1 auto; min-width: 0; border-left: 1px solid var(--line); padding-left: 14px; }
      .row .body .content { font-size: 19px; font-weight: 700; line-height: 1.45; }
      .row .body .size { font-size: 13.5px; color: var(--ink-soft); margin-top: 2px; }
      .row .play {
        flex: 0 0 auto; width: 54px; height: 54px; border-radius: 50%;
        background: var(--deep); color: var(--gold-bright);
        display: inline-flex; align-items: center; justify-content: center;
        border: none; pointer-events: none;
      }
      .row .play svg { width: 21px; height: 21px; fill: currentColor; }
      .row.playing { border-color: var(--gold); outline: 1.5px solid var(--gold); }
      .row.playing .play { background: var(--gold); color: #fff8e7; }
      .notice {
        background: var(--notice-bg); border: 1px dashed var(--line); border-radius: 12px;
        padding: 14px 16px; margin-bottom: 10px;
        font-size: 16.5px; color: var(--ink-soft); text-align: center;
      }
      .empty { text-align: center; color: var(--ink-soft); font-size: 17px; padding: 34px 0 8px; display: none; }

      footer.page {
        margin-top: 44px; border-top: 1px solid var(--line); padding-top: 20px;
        font-size: 15.5px; color: var(--ink-soft); text-align: center;
      }
      footer.page a { color: var(--gold); font-weight: 600; }
      footer.page p { margin: 6px 0; }
    </style>

      var icoPause = document.getElementById("icoPause");
      var currentIndex = -1; /* index into BIBLE, -1 = nothing loaded */
      var speeds = [1, 1.25, 1.5, 2, 0.75];
      var speedPos = 0;

      function fmtTime(sec) {
        if (!isFinite(sec) || sec < 0) sec = 0;
        sec = Math.floor(sec);
        var m = Math.floor(sec / 60), s = sec % 60;
        return m + ":" + (s < 10 ? "0" : "") + s;
      }
      function fmtDate(iso) {
        var p = iso.split("-");
        return p[0] + "年" + parseInt(p[1], 10) + "月" + parseInt(p[2], 10) + "日";
      }
      var SVG_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
      var SVG_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

      /* ---------- build the list ---------- */
      var listEl = document.getElementById("list");
      var rowEls = []; /* per BIBLE index */

      SECTION_ORDER.forEach(function (sec) {
        var items = [];
        BIBLE.forEach(function (entry, i) { if (entry.section === sec) items.push(i); });
        if (!items.length) return;

        var sectionEl = document.createElement("section");
        sectionEl.className = "group";
        sectionEl.setAttribute("data-section", sec);

        var h2 = document.createElement("h2");
        h2.innerHTML = "";
        h2.appendChild(document.createTextNode(sec));
        var gc = document.createElement("span");
        gc.className = "gcount";
        gc.textContent = items.length + " 講";
        h2.appendChild(gc);
        sectionEl.appendChild(h2);
        var grule = document.createElement("div");
        grule.className = "grule";
        sectionEl.appendChild(grule);

        var noticesHere = NOTICES.filter(function (n) { return n.section === sec; });

        function addNotice(n) {
          var d = document.createElement("div");
          d.className = "notice";
          d.setAttribute("data-notice", n.text);
          d.textContent = n.text;
          sectionEl.appendChild(d);
        }

        items.forEach(function (bi, pos) {
          noticesHere.forEach(function (n) { if (n.after_index === pos) addNotice(n); });
          var entry = BIBLE[bi];
          var p = entry.date.split("-");
          var row = document.createElement("button");
          row.type = "button";
          row.className = "row";
          row.setAttribute("data-index", bi);
          row.setAttribute("data-search", (entry.content + " " + entry.date + " " + fmtDate(entry.date) + " " + parseInt(p[1], 10) + "月" + parseInt(p[2], 10) + "日").toLowerCase());

          var meta = document.createElement("span");
          meta.className = "meta";
          var y = document.createElement("span"); y.className = "y"; y.textContent = p[0];
          var md = document.createElement("span"); md.className = "md";
          md.textContent = parseInt(p[1], 10) + "月" + parseInt(p[2], 10) + "日";
          meta.appendChild(y); meta.appendChild(document.createElement("br")); meta.appendChild(md);

          var body = document.createElement("span");
          body.className = "body";
          var c = document.createElement("span"); c.className = "content"; c.textContent = entry.content;
          var sz = document.createElement("span"); sz.className = "size";
          sz.textContent = "音檔 " + entry.size;
          body.appendChild(c); body.appendChild(document.createElement("br")); body.appendChild(sz);

          var play = document.createElement("span");
          play.className = "play";
          play.innerHTML = SVG_PLAY;

          row.appendChild(meta); row.appendChild(body); row.appendChild(play);
          row.addEventListener("click", function () { toggleEntry(bi); });
          sectionEl.appendChild(row);
          rowEls[bi] = row;
        });
        noticesHere.forEach(function (n) { if (n.after_index >= items.length) addNotice(n); });

        listEl.appendChild(sectionEl);
      });

      /* ---------- playback ---------- */
      function setPlayIcon(playing) {
        icoPlay.style.display = playing ? "none" : "";
        icoPause.style.display = playing ? "" : "none";
        if (currentIndex >= 0 && rowEls[currentIndex]) {
          rowEls[currentIndex].querySelector(".play").innerHTML = playing ? SVG_PAUSE : SVG_PLAY;
        }
      }
      function markPlayingRow() {
        rowEls.forEach(function (r, i) {
          if (!r) return;
          if (i === currentIndex) r.classList.add("playing");
          else { r.classList.remove("playing"); r.querySelector(".play").innerHTML = SVG_PLAY; }
        });
      }
      function loadEntry(i, autoplay) {
        currentIndex = i;
        var entry = BIBLE[i];
        audio.src = entry.mp3_url;
        audio.playbackRate = speeds[speedPos];
        nowPlaying.classList.remove("idle");
        nowPlaying.innerHTML = "";
        var d = document.createElement("span");
        d.className = "date"; d.textContent = fmtDate(entry.date);
        nowPlaying.appendChild(d);
        nowPlaying.appendChild(document.createTextNode(entry.content));
        seek.value = 0; seek.style.setProperty("--fill", "0%");
        timeCur.textContent = "0:00"; timeDur.textContent = "0:00";
        markPlayingRow();
        if (autoplay) audio.play();
      }
      function toggleEntry(i) {
        if (i === currentIndex && audio.src) {
          if (audio.paused) audio.play(); else audio.pause();
        } else {
          loadEntry(i, true);
        }
      }
      btnPlay.addEventListener("click", function () {
        if (currentIndex < 0) { loadEntry(0, true); return; }
        if (audio.paused) audio.play(); else audio.pause();
      });
      document.getElementById("btnBack").addEventListener("click", function () {
        if (currentIndex >= 0) audio.currentTime = Math.max(0, audio.currentTime - 15);
      });
      document.getElementById("btnFwd").addEventListener("click", function () {
        if (currentIndex >= 0 && isFinite(audio.duration)) audio.currentTime = Math.min(audio.duration, audio.currentTime + 15);
      });
      var btnSpeed = document.getElementById("btnSpeed");
      btnSpeed.addEventListener("click", function () {
        speedPos = (speedPos + 1) % speeds.length;
        audio.playbackRate = speeds[speedPos];
        btnSpeed.textContent = speeds[speedPos].toFixed(2).replace(/0$/, "") + "×";
      });
      audio.addEventListener("play", function () { setPlayIcon(true); });
      audio.addEventListener("pause", function () { setPlayIcon(false); });
      audio.addEventListener("loadedmetadata", function () { timeDur.textContent = fmtTime(audio.duration); });
      audio.addEventListener("timeupdate", function () {
        if (isFinite(audio.duration) && audio.duration > 0) {
          var pct = (audio.currentTime / audio.duration) * 100;
          seek.value = pct;
          seek.style.setProperty("--fill", pct + "%");
        }
        timeCur.textContent = fmtTime(audio.currentTime);
      });
      seek.addEventListener("input", function () {
        if (currentIndex >= 0 && isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = (seek.value / 100) * audio.duration;
        }
      });
      audio.addEventListener("ended", function () {
        setPlayIcon(false);
        if (currentIndex >= 0 && currentIndex < BIBLE.length - 1) loadEntry(currentIndex + 1, true);
      });

      /* ---------- search ---------- */
      var searchBox = document.getElementById("searchBox");
      var resultNote = document.getElementById("resultNote");
      var emptyNote = document.getElementById("emptyNote");
      searchBox.addEventListener("input", function () {
        var q = searchBox.value.trim().toLowerCase();
        var visibleTotal = 0;
        document.querySelectorAll("section.group").forEach(function (secEl) {
          var visible = 0;
          secEl.querySelectorAll(".row").forEach(function (row) {
            var hit = !q || row.getAttribute("data-search").indexOf(q) >= 0;
            row.style.display = hit ? "" : "none";
            if (hit) visible++;
          });
          secEl.querySelectorAll(".notice").forEach(function (n) {
            var hit = !q || n.getAttribute("data-notice").toLowerCase().indexOf(q) >= 0;
            n.style.display = hit ? "" : "none";
          });
          secEl.style.display = visible > 0 ? "" : "none";
          visibleTotal += visible;
        });
        emptyNote.style.display = (q && visibleTotal === 0) ? "block" : "none";
        resultNote.textContent = q ? ("找到 " + visibleTotal + " 講") : "";
      });
    </script>
  </body>
</html>
